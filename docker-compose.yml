# =============================================================================
# Entorno local de desarrollo: app + Prometheus + Grafana.
# Sirve para validar la instrumentación de métricas sin levantar Kubernetes.
#
#   docker compose up --build -d
#   App        -> http://localhost:8000/docs
#   Prometheus -> http://localhost:9090
#   Grafana    -> http://localhost:3000  (admin / admin)
# =============================================================================

services:
  app:
    build:
      context: .
      args:
        GIT_SHA: ${GIT_SHA:-local}
    image: task-api:local
    container_name: task-api
    ports:
      - "8000:8000"
    environment:
      APP_ENVIRONMENT: local
      APP_LOG_LEVEL: INFO
      # En local se lee de un .env; nunca se hardcodea en este archivo.
      APP_API_KEY: ${APP_API_KEY:-dev-local-key}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=6h
      - --web.enable-lifecycle
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
