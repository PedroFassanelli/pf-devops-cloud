apiVersion: v1
kind: Service
metadata:
  name: task-api
  namespace: task-api
  labels:
    app.kubernetes.io/name: task-api
spec:
  # ClusterIP: la exposición externa la resuelve el Ingress, no el Service.
  # Un LoadBalancer por servicio en AWS son ~US$18/mes cada uno (FinOps).
  type: ClusterIP
  selector:
    app.kubernetes.io/name: task-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
