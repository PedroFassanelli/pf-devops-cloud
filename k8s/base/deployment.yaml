apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api
  namespace: task-api
  labels:
    app.kubernetes.io/name: task-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/version: "1.0.0"
spec:
  # No se fija replicas: el HPA es el dueño de este campo. Fijarlo acá genera
  # una pelea entre el Deployment y el HPA en cada despliegue.
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0   # despliegue sin downtime
  selector:
    matchLabels:
      app.kubernetes.io/name: task-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: task-api
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: task-api
          image: ghcr.io/USUARIO/task-api:latest   # sobrescrito por el pipeline
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: task-api-config
            - secretRef:
                name: task-api-secret
          # FinOps: requests define lo que se reserva (y lo que se paga);
          # limits evita que un Pod se coma el nodo. Los requests de CPU son
          # además la base de cálculo del HPA.
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 192Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # startupProbe protege arranques lentos sin relajar la liveness.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # readOnlyRootFilesystem obliga a montar un emptyDir para /tmp.
        - name: tmp
          emptyDir: {}
      # Reparte réplicas entre nodos: si cae un nodo, no cae todo el servicio.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: task-api
