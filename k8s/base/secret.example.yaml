# =============================================================================
# PLANTILLA DE EJEMPLO — NO contiene valores reales y NO se aplica en el pipeline.
#
# El Secret real se crea desde GitHub Actions leyendo secrets del repositorio:
#   kubectl create secret generic task-api-secret \
#     --namespace task-api \
#     --from-literal=APP_API_KEY="$APP_API_KEY" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# Nota: los Secret de Kubernetes están en base64, NO cifrados. En producción
# corresponde External Secrets Operator + AWS Secrets Manager, o Sealed Secrets.
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: task-api-secret
  namespace: task-api
type: Opaque
stringData:
  APP_API_KEY: "REEMPLAZAR-EN-TIEMPO-DE-DESPLIEGUE"
